[package]
name = "mitra-adapter-windows"
version = "0.1.0"
edition = "2021"
description = "Windows Platform Abstraction Layer implementation for Mitra Audio Network System"
authors = ["Mitra Audio Network System Engineering Team"]

[dependencies]
mitra-core = { path = "../mitra-core" }
mitra-pal = { path = "../mitra-pal" }
socket2 = { version = "0.5", features = ["all"] }
sha2 = { version = "0.10" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_Security_Cryptography"
] }
